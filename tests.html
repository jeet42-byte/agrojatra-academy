* { box-sizing: border-box; }

.set { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: center; text-align: left; width: 100%;

.item .no-t { color: var(--bad); }
.item .why { color: var(--muted); font-size: 0.95rem; }
.cta { background: var(--surface); border: 1.5px dashed var(--signal); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; }

.site-foot { border-top: 1px solid var(--line); padding-block: 28px; color: var(--muted); font-size: 0.92rem;

@media print { .wa-float { display: none; } }

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  var app = document.getElementById("app");
  var state = null, tick = null;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function home() {
    clearInterval(tick); state = null; app.innerHTML = "";
    var head = el("div"); head.style.cssText = "display:grid;gap:10px";
    head.appendChild(el("p", "eyebrow", "Free model tests"));
    head.appendChild(el("h1", null, "ফ্রি মডেল টেস্ট")); head.lastChild.style.fontSize = "2.2rem";
    head.appendChild(el("p", "lede", "প্রতি প্রশ্নে ১ মিনিট। শেষে নম্বর আর প্রতিটি প্রশ্নের ব্যাখ্যা দেখতে পাবেন।"));
    app.appendChild(head);
    var list = el("div", "list");
    TESTS.forEach(function (t) {
      var b = el("button", "set"); b.type = "button";
      b.appendChild(el("b", null, t.title));
      var go = el("span", "go", "শুরু করুন →"); b.appendChild(go);
      var meta = el("span", "meta", t.who + " · " + bn(t.q.length) + "টি প্রশ্ন · " + bn(t.q.length) + " মিনিট");
      var best = store("agrojatra-best-" + t.id);
      if (best) { meta.appendChild(document.createTextNode(" · ")); meta.appendChild(el("span", "best", "সেরা: " + bn(best) + "/" + bn(t.q.length))); }
      b.appendChild(meta);
      b.addEventListener("click", function () { start(t); });
      list.appendChild(b);
    });
    app.appendChild(list);
  }

  function start(t) {
    var qs = t.q.slice();
    for (var j = qs.length - 1; j > 0; j--) { var r = Math.floor(Math.random() * (j + 1)); var tmp = qs[j]; qs[j] = qs[r]; qs[r] = tmp; }
    state = { t: t, qs: qs, i: 0, answers: new Array(qs.length).fill(null), left: qs.length * SECONDS_PER_Q };
    clearInterval(tick);
    tick = setInterval(function () { state.left--; drawTimer(); if (state.left <= 0) finish(); }, 1000);
    draw(); window.scrollTo(0, 0);
  }

  function drawTimer() {
    var t = document.getElementById("timer"); if (!t) return;
    var m = Math.floor(state.left / 60), s = state.left % 60;
    t.textContent = "সময় বাকি " + bn(m) + ":" + bn(String(s).padStart(2, "0"));
    t.classList.toggle("low", state.left <= 60);
  }

  function draw() {
    var t = state.t, i = state.i, item = state.qs[i];
    app.innerHTML = "";
    var bar = el("div", "bar");
    bar.appendChild(el("span", null, t.title + " · প্রশ্ন " + bn(i + 1) + "/" + bn(t.q.length)));
    var tm = el("span", "timer"); tm.id = "timer"; bar.appendChild(tm);
    app.appendChild(bar);
    var pr = el("div", "progress"), fill = el("i"); fill.style.width = ((i + 1) / t.q.length * 100) + "%"; pr.appendChild(fill); app.appendChild(pr);
    app.appendChild(el("p", "q", item[0]));
    var opts = el("div", "opts");
    item[1].forEach(function (o, k) {
      var b = el("button", "opt"); b.type = "button";
      b.setAttribute("aria-pressed", state.answers[i] === k ? "true" : "false");
      b.appendChild(el("span", null, LETTERS[k])); b.appendChild(el("span", null, o));
      b.addEventListener("click", function () { state.answers[i] = k; draw(); });
      opts.appendChild(b);
    });
    app.appendChild(opts);
    var nav = el("div", "nav");
    var prev = el("button", "btn ghost", "← আগের"); prev.type = "button"; prev.disabled = i === 0;
    prev.addEventListener("click", function () { state.i--; draw(); });
    var last = i === t.q.length - 1;
    var next = el("button", "btn" + (last ? " enrol" : ""), last ? "জমা দিন" : "পরের →"); next.type = "button";
    next.addEventListener("click", function () { if (last) finish(); else { state.i++; draw(); } });
    nav.appendChild(prev); nav.appendChild(next);
    app.appendChild(nav);
    drawTimer();
  }

  function finish() {
    clearInterval(tick);
    var t = state.t, right = 0;
    state.qs.forEach(function (item, k) { if (state.answers[k] === item[2]) right++; });
    var prevBest = Number(store("agrojatra-best-" + t.id) || 0);
    if (right > prevBest) store("agrojatra-best-" + t.id, String(right));
    app.innerHTML = "";
    app.appendChild(el("p", "eyebrow", t.title + " · ফলাফল"));
    var sc = el("div", "score");
    sc.appendChild(el("strong", null, bn(right) + "/" + bn(t.q.length)));
    var pct = Math.round(right / t.q.length * 100);
    sc.appendChild(el("span", "lede", pct >= 80 ? "চমৎকার! এভাবেই চালিয়ে যান।" : pct >= 50 ? "ভালো, তবে আরও অনুশীলন দরকার।" : "নিয়মিত অনুশীলন করলে উন্নতি হবে।"));
    app.appendChild(sc);

    var cta = el("div", "cta");
    cta.appendChild(el("p", null, "পূর্ণ প্রস্তুতির জন্য লাইভ ক্লাস, আরও মডেল টেস্ট আর মক ভাইভা পাবেন আমাদের কোর্সে।"));
    var row = el("div", "nav");
    var enrol = el("a", "btn enrol", "ভর্তি হোন"); enrol.href = "./#enrol";
    var again = el("button", "btn ghost", "অন্য টেস্ট দিন"); again.type = "button"; again.addEventListener("click", home);
    row.appendChild(enrol); row.appendChild(again); cta.appendChild(row);
    app.appendChild(cta);

    app.appendChild(el("h2", null, "উত্তর ও ব্যাখ্যা")); app.lastChild.style.fontSize = "1.5rem";
    var rv = el("div", "review");
    state.qs.forEach(function (item, k) {
      var a = state.answers[k], ok = a === item[2];
      var box = el("div", "item " + (ok ? "ok" : "no"));
      box.appendChild(el("p", null, bn(k + 1) + ". " + item[0]));
      var ans = el("p", "ans");
      if (ok) ans.appendChild(el("span", "ok-t", "✓ সঠিক: " + item[1][item[2]]));
      else {
        ans.appendChild(el("span", "no-t", a == null ? "✗ উত্তর দেননি" : "✗ আপনার উত্তর: " + item[1][a]));
        ans.appendChild(document.createTextNode(" · সঠিক: " + item[1][item[2]]));
      }
      box.appendChild(ans);
      box.appendChild(el("p", "why", item[3]));
      rv.appendChild(box);
    });
    app.appendChild(rv);
    window.scrollTo(0, 0);
  }

  home();
  var deep = TESTS.filter(function (t) { return "#" + t.id === location.hash; })[0];
  if (deep) start(deep);
})();
</script>
